name: Agréger les signalements

# Reconstruit community_blacklist.json à partir des Issues de signalement.
# Anti-abus : une empreinte n'est publiée qu'après >= 3 signalements de comptes DISTINCTS,
# ou si un signalement porte le label "verified" (validation mainteneur).
# Révocation : une issue portant le label "false-positive" marque l'empreinte deleted:true
# (les applications la retirent alors de leur base locale).
# Visibilité : pending.json liste les empreintes en attente de seuil (1-2 signalements).

on:
  issues:
    types: [opened, edited, labeled, unlabeled, reopened, closed, deleted]
  schedule:
    - cron: "17 * * * *"   # filet de sécurité horaire
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: aggregate
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruire la base
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const THRESHOLD = 3;
            const CATS = ["TELEMARKETING","SCAM","ROBOCALL","SPOOFING","OTHER","LEGITIMATE","UNDETERMINED"];
            const HASH_RE = /\b[a-f0-9]{64}\b/i;

            const hashOf = (body) => { const m = (body||'').match(HASH_RE); return m ? m[0].toLowerCase() : null; };

            // Signalements (label report)
            const reportIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, labels: 'report', state: 'all', per_page: 100,
            });
            // Faux positifs (label false-positive) — révocation
            const fpIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, labels: 'false-positive', state: 'all', per_page: 100,
            });

            const byHash = {};
            for (const it of reportIssues) {
              if (it.pull_request) continue;
              const hash = hashOf(it.body); if (!hash) continue;
              const body = it.body || '';
              const cat = CATS.find(c => new RegExp('\\b' + c + '\\b').test(body)) || 'OTHER';
              const verified = (it.labels || []).some(l => (l.name || l) === 'verified');
              let label = null;
              const lm = body.match(/Libell[ée][^\n]*\n+([^\n#_][^\n]*)/i);
              if (lm) { const t = lm[1].trim(); if (t && !/^_no response_$/i.test(t)) label = t.slice(0, 80); }
              const e = byHash[hash] || (byHash[hash] = { reporters: new Set(), cats: {}, label: null, verified: false });
              e.reporters.add((it.user && it.user.login) || ('anon' + it.number));
              e.cats[cat] = (e.cats[cat] || 0) + 1;
              if (verified) e.verified = true;
              if (!e.label && label) e.label = label;
            }

            const revoked = new Set();
            for (const it of fpIssues) { const h = hashOf(it.body); if (h) revoked.add(h); }

            // Base existante
            let data = { synced_at: 0, entries: [] };
            try { data = JSON.parse(fs.readFileSync('community_blacklist.json', 'utf8')); } catch (e) {}
            const map = new Map((data.entries || []).map(e => [e.phone_hash, e]));

            // Ajouts / mises à jour qualifiés
            const pending = [];
            for (const [hash, info] of Object.entries(byHash)) {
              if (revoked.has(hash)) continue;
              const count = info.reporters.size;
              if (count < THRESHOLD && !info.verified) {
                pending.push({ phone_hash: hash, reporters: count, needed: THRESHOLD - count });
                continue;
              }
              const cat = Object.entries(info.cats).sort((a, b) => b[1] - a[1])[0][0];
              const prev = map.get(hash);
              map.set(hash, {
                phone_hash: hash, category: cat,
                report_count: Math.max(count, (prev && prev.report_count) || 0),
                label: (prev && prev.label) || info.label || null, deleted: false,
              });
            }
            // Révocations : tombstone deleted:true (les clients retirent l'entrée)
            for (const hash of revoked) {
              const prev = map.get(hash);
              map.set(hash, {
                phone_hash: hash, category: (prev && prev.category) || 'OTHER',
                report_count: (prev && prev.report_count) || 0,
                label: (prev && prev.label) || null, deleted: true,
              });
            }

            // Sortie déterministe (triée par empreinte) — diffs propres
            const entries = [...map.values()].sort((a, b) => a.phone_hash < b.phone_hash ? -1 : 1);
            const oldSig = JSON.stringify((data.entries || []).map(e => [e.phone_hash, e.category, e.report_count, e.label, e.deleted]).sort());
            const newSig = JSON.stringify(entries.map(e => [e.phone_hash, e.category, e.report_count, e.label, e.deleted]).sort());

            if (oldSig !== newSig) {
              data.entries = entries;
              data.synced_at = Date.now();   // ne change QUE si le contenu change
              fs.writeFileSync('community_blacklist.json', JSON.stringify(data));
              core.notice(`Base mise à jour : ${entries.length} entrées (dont révoquées: ${revoked.size}).`);
            } else {
              core.notice('Base inchangée — aucun commit.');
            }

            // pending.json (visibilité modération) — écrit seulement si changé
            pending.sort((a, b) => b.reporters - a.reporters);
            const pendingOut = JSON.stringify({ updated_at: Date.now(), threshold: THRESHOLD, pending }, null, 2);
            let prevPending = '';
            try { prevPending = fs.readFileSync('pending.json', 'utf8'); } catch (e) {}
            const norm = s => s.replace(/"updated_at":\s*\d+,?/, '');
            if (norm(prevPending) !== norm(pendingOut)) {
              fs.writeFileSync('pending.json', pendingOut);
              core.notice(`pending.json : ${pending.length} empreinte(s) en attente.`);
            }

      - name: Commit si modifié
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Aucun changement."
          else
            git commit -m "community: agrégation automatique des signalements"
            git push
          fi
